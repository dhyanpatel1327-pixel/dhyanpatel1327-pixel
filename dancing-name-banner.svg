<svg width="1600" height="300" viewBox="0 0 1600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="300" fill="url(#bgGrad)"/>

  <!-- Bouncing + dancing name group -->
  <g>
    <!-- Vertical jump animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-25; 0,0; 0,-10; 0,0"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      dur="1.4s"
      repeatCount="indefinite"/>

    <text x="800" y="150" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="bold"
          fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle">
      Dhyan Patel

      <!-- Left-right dance sway -->
      <animate attributeName="x" values="800;830;770;800" dur="2s" repeatCount="indefinite"/>

      <!-- Slight rotation for dance wobble -->
      <animateTransform attributeName="transform" type="rotate"
        values="0 800 150; 3 800 150; -3 800 150; 0 800 150"
        dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </text>
  </g>

  <!-- Subtitle, static -->
  <text x="800" y="215" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#c9d1d9" text-anchor="middle">
    Venture Builder · AI Product Builder
  </text>
</svg>
